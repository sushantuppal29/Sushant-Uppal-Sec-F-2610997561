
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<html>
<head>
    <title>Explore the World - Travel Agency</title>
</head>

<frameset rows="20%,65%,15%">

    <frame src="header.html"
           name="headerFrame"
           scrolling="no"
           noresize="noresize"
           frameborder="1"
           marginwidth="5"
           marginheight="5">

    <frameset cols="25%,45%,30%">

        <frame src="navigation.html"
               name="navFrame"
               scrolling="auto"
               noresize="noresize"
               frameborder="1"
               marginwidth="10"
               marginheight="10">

        <frame src="home.html"
               name="destFrame"
               scrolling="auto"
               noresize="noresize"
               frameborder="1"
               marginwidth="10"
               marginheight="10">

        <frame src="packages.html"
               name="packFrame"
               scrolling="auto"
               noresize="noresize"
               frameborder="1"
               marginwidth="10"
               marginheight="10">

    </frameset>

    <frame src="footer.html"
           name="footerFrame"
           scrolling="no"
           noresize="noresize"
           frameborder="1"
           marginwidth="5"
           marginheight="5">

    <noframes>
        <body>
            Your browser does not support frames.
        </body>
    </noframes>

</frameset>
</html>
